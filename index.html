  <style>
    :root {
      --bg-0: #07070b;
      --text-0: #f5f5f8;
      --text-1: #bcbcca;
      --text-2: #6f6f80;
      --accent: #5f9b8b;
      --accent-2: #6aa3b5;
      --card: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: var(--bg-0);
      background-image: radial-gradient(60% 45% at 50% -5%, rgba(255, 255, 255, 0.05), transparent 60%);
      background-repeat: no-repeat;
      color: var(--text-0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 64px 20px 48px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 30%;
      border: 2px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 24px 0 18px;
      color: var(--text-0);
    }
    .bio {
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text-1);
      margin: 0 0 32px;
      width: 100%;
      max-width: 420px;
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 52px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-0);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-wrap: balance;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .link .icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 23px;
      height: 23px;
      color: var(--brand, var(--text-0));
      display: inline-flex;
    }
    .link .icon svg { width: 100%; height: 100%; fill: currentColor; display: block; }
    /* The Ix mark is wider than it is tall; contain keeps it from stretching. */
    .link .icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .link:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: var(--brand, rgba(255, 255, 255, 0.2));
      box-shadow: 0 0 0 1px var(--brand, transparent), 0 12px 34px rgba(0, 0, 0, 0.5);
    }
    .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer {
      margin-top: 34px;
      font-size: 0.8rem;
      color: var(--text-2);
    }
    @media (max-width: 480px) {
      body { padding: 46px 16px 36px; }
      h1 { font-size: 2rem; }
      .bio { font-size: 0.93rem; }
      .avatar { width: 120px; height: 120px; }
      .link { padding: 15px 48px; }
    }
  </style>
